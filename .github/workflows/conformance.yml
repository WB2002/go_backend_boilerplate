name: Polyglot Conformance Audit

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: conformance_app
          POSTGRES_PASSWORD: conformance_pg_password
          POSTGRES_DB: conformance_db
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U conformance_app -d conformance_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.2.2-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: conformance_mongo
          MONGO_INITDB_ROOT_PASSWORD: conformance_mongo_password
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh -u conformance_mongo -p conformance_mongo_password --authenticationDatabase admin --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        run: ./scripts/ci/free-disk-space.sh

      - name: Checkout conformance runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ vars.CONFORMANCE_REPO || format('{0}/backend_security_and_conformance_tests', github.repository_owner) }}
          token: ${{ secrets.CONFORMANCE_REPO_TOKEN || github.token }}
          path: .conformance-runner

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build conformance-audit
        run: |
          cd .conformance-runner && go build -o "${RUNNER_TEMP}/conformance-audit" ./cmd/conformance-audit
          go clean -cache -modcache
          cd "${GITHUB_WORKSPACE}" && rm -rf .conformance-runner

      - name: Build Go API server
        run: go build -o "${RUNNER_TEMP}/go-api" ./cmd/api

      - name: Run PR/Push Conformance Gate
        if: github.event_name != 'schedule'
        env:
          CONFORMANCE_AUDIT_BIN: ${{ runner.temp }}/conformance-audit
          CONFORMANCE_API_BIN: ${{ runner.temp }}/go-api
          POSTGRES_PORT: '15432'
          POSTGRES_USER: conformance_app
          POSTGRES_PASSWORD: conformance_pg_password
          POSTGRES_DB: conformance_db
          REDIS_PORT: '16379'
          MONGO_URI: mongodb://conformance_mongo:conformance_mongo_password@127.0.0.1:27018/go-conformance?authSource=admin
        run: ./scripts/ci/run-conformance-audit.sh --stages sast,graph,pentest,load --profile baseline --output reports

      - name: Run Nightly Full Soak & DAST Audit
        if: github.event_name == 'schedule'
        env:
          CONFORMANCE_AUDIT_BIN: ${{ runner.temp }}/conformance-audit
          CONFORMANCE_API_BIN: ${{ runner.temp }}/go-api
          POSTGRES_PORT: '15432'
          POSTGRES_USER: conformance_app
          POSTGRES_PASSWORD: conformance_pg_password
          POSTGRES_DB: conformance_db
          REDIS_PORT: '16379'
          MONGO_URI: mongodb://conformance_mongo:conformance_mongo_password@127.0.0.1:27018/go-conformance?authSource=admin
        run: ./scripts/ci/run-conformance-audit.sh --stages all --profile soak --output reports

      - name: Upload SARIF to GitHub Security
        # SARIF upload needs Settings -> Security -> Code scanning enabled on the repo.
        if: always() && vars.CODEQL_UPLOAD == 'true' && hashFiles('reports/go-backend-boilerplate/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          sarif_file: reports/go-backend-boilerplate/results.sarif

      - name: Upload 4-part Conformance Bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-report
          path: reports/go-backend-boilerplate/
