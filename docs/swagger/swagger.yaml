basePath: /
definitions:
  account.ChangePasswordRequest:
    properties:
      newPassword:
        maxLength: 128
        minLength: 8
        type: string
      oldPassword:
        maxLength: 128
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  account.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  account.LoginRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 128
        type: string
    required:
    - email
    - password
    type: object
  account.RegisterRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 128
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  account.ResetPasswordRequest:
    properties:
      newPassword:
        maxLength: 128
        minLength: 8
        type: string
      token:
        type: string
    required:
    - newPassword
    - token
    type: object
  account.TokenResponse:
    properties:
      accessToken:
        type: string
      expiresIn:
        type: integer
      refreshToken:
        type: string
      tokenType:
        type: string
    type: object
  account.UserResponse:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      roles:
        items:
          type: string
        type: array
      status:
        type: string
    type: object
  graphql.RequestPayload:
    properties:
      operationName:
        type: string
      query:
        type: string
      variables:
        additionalProperties: true
        type: object
    type: object
  problem.Details:
    properties:
      code:
        type: string
      detail:
        type: string
      error:
        type: string
      instance:
        type: string
      invalid_params:
        items:
          $ref: '#/definitions/problem.InvalidParam'
        type: array
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  problem.InvalidParam:
    properties:
      code:
        type: string
      field:
        type: string
      reason:
        type: string
    type: object
  telemetry.CheckStatus:
    properties:
      error:
        type: string
      status:
        description: '"UP" or "DOWN"'
        type: string
    type: object
  telemetry.HealthResponse:
    properties:
      services:
        additionalProperties:
          $ref: '#/definitions/telemetry.CheckStatus'
        type: object
      status:
        description: '"UP" or "DOWN"'
        type: string
      system_stats:
        $ref: '#/definitions/telemetry.SystemStats'
      timestamp:
        type: string
    type: object
  telemetry.SystemStats:
    properties:
      alloc_bytes:
        type: integer
      goroutines:
        type: integer
      heap_alloc_bytes:
        type: integer
      heap_sys_bytes:
        type: integer
      num_gc:
        type: integer
      sys_bytes:
        type: integer
      total_alloc_bytes:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: Production-grade Go backend boilerplate API.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://example.com/terms/
  title: Go Backend Boilerplate API
  version: "1.0"
paths:
  /account/change-password:
    post:
      consumes:
      - application/json
      description: Updates user password given verified old password and compliant
        new password
      parameters:
      - description: Change password payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.ChangePasswordRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Details'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/problem.Details'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/problem.Details'
      security:
      - BearerAuth: []
      summary: Change user password
      tags:
      - Account
  /account/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a password reset link to the email address if it exists
      parameters:
      - description: Forgot password payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.ForgotPasswordRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Details'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Request password reset
      tags:
      - Account
  /account/login:
    post:
      consumes:
      - application/json
      description: Verifies user email and password, returning JWT access and refresh
        token pair
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.LoginRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Details'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/problem.Details'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Authenticate user
      tags:
      - Account
  /account/me:
    get:
      description: Returns the profile data of the currently authenticated user
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/problem.Details'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/problem.Details'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/problem.Details'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - Account
  /account/refresh:
    post:
      consumes:
      - application/json
      description: Invalidates consumed refresh token and issues a new access and
        refresh token pair
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Details'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/problem.Details'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Rotate refresh token
      tags:
      - Account
  /account/register:
    post:
      consumes:
      - application/json
      description: Creates a new user profile with hashed password credentials
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.RegisterRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/account.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Details'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/problem.Details'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Register a new user account
      tags:
      - Account
  /account/reset-password:
    post:
      consumes:
      - application/json
      description: Updates user password given a valid 15-minute recovery token
      parameters:
      - description: Reset password payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.ResetPasswordRequest'
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/problem.Details'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/problem.Details'
      summary: Finalize password reset
      tags:
      - Account
  /graphql:
    get:
      consumes:
      - application/json
      description: Executes a GraphQL query or mutation with depth, complexity, and
        budget enforcement
      parameters:
      - description: GraphQL request payload
        in: body
        name: request
        schema:
          $ref: '#/definitions/graphql.RequestPayload'
      - description: GraphQL query string
        in: query
        name: query
        type: string
      - description: GraphQL operation name
        in: query
        name: operationName
        type: string
      - description: JSON-encoded GraphQL variables
        in: query
        name: variables
        type: string
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties: true
            type: object
      summary: Execute GraphQL query
      tags:
      - GraphQL
    post:
      consumes:
      - application/json
      description: Executes a GraphQL query or mutation with depth, complexity, and
        budget enforcement
      parameters:
      - description: GraphQL request payload
        in: body
        name: request
        schema:
          $ref: '#/definitions/graphql.RequestPayload'
      - description: GraphQL query string
        in: query
        name: query
        type: string
      - description: GraphQL operation name
        in: query
        name: operationName
        type: string
      - description: JSON-encoded GraphQL variables
        in: query
        name: variables
        type: string
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "413":
          description: Request Entity Too Large
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties: true
            type: object
      summary: Execute GraphQL query
      tags:
      - GraphQL
  /health:
    get:
      description: Aggregate dependency health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/telemetry.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/telemetry.HealthResponse'
      summary: Deep health check
      tags:
      - Health
  /health/live:
    get:
      description: Lightweight in-memory liveness check
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe
      tags:
      - Health
  /health/ready:
    get:
      description: Readiness check returning 503 while draining
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness probe
      tags:
      - Health
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
