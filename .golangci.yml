version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

formatters:
  enable:
    - gofmt

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - forbidigo
  settings:
    govet:
      enable-all: false
      enable:
        - nilness
    revive:
      rules:
        - name: exported
          disabled: false
        - name: package-comments
          disabled: true
    forbidigo:
      forbid:
        - pattern: '^(temp|tmp)$'
          msg: "Vague temporary variable name. Use a descriptive domain identifier."
        - pattern: '^(foo|bar|baz|qux)$'
          msg: "Placeholder identifier. Use a realistic domain identifier."
        - pattern: '^(obj|thing|stuff)$'
          msg: "Vague generic variable name. Name the specific domain model."
        - pattern: '^(var[0-9]+|testVar|myVar|myFunc)$'
          msg: "Vague numbered or informal variable name. Use a descriptive domain identifier."
        - pattern: '^(doSomething|handleStuff|processData|dummyFunc)$'
          msg: "Vague placeholder function. Name the specific domain action."
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
